resources:
  # Global random seed used for dataset sampling and other reproducible ops.
  seed: 1337
  # CPU threads used by OpenMP-backed libraries such as NumPy / PyTorch kernels.
  omp_threads: 4
  # Torch matmul precision hint; common values are `highest`, `high`, or `medium`.
  matmul_precision: high
  # Enable DistributedDataParallel when launching with `torchrun`: `true` or `false`.
  distributed: true
  # DDP backend when `distributed` is true; typically `nccl` or `gloo`.
  dist_backend: nccl
  # Collective timeout in minutes for DDP sync points such as rank-0 validation.
  dist_timeout_minutes: 30
  # Ask DDP to tolerate intermittently unused parameters: `true` or `false`.
  ddp_find_unused_parameters: true

logging:
  # Console/file log verbosity: `error`, `info`, or `debug`.
  level: debug
  # Prefix each log line with a timestamp: `true` or `false`.
  timestamps: true
  # Log file path, or leave blank for console-only logs.
  file: /user/davide.mattioli/u20330/Dinov3-LWF-Segmentation/logs/run.log
  # Create one log file per run id: `true` or `false`.
  per_run: true

paths:
  # Directory containing the raw input GeoTIFF imagery used by prepare.
  raw_images_dir: /mnt/ceph-hdd/projects/mthesis_davide_mattioli/patches_mt/folder_1/
  # Full raster label path read during prepare when tiles are built or rebuilt.
  label_path: /user/davide.mattioli/u20330/Dinov3-LWF-Segmentation/crf/final_labels_1m.tif
  # Base cache root for generated `.pt` tiles; training reads cached tiles here.
  processed_dir: /mnt/ceph-hdd/projects/mthesis_davide_mattioli/processed/folder_2_3/

dataset:
  # Cache DINO features inside `.pt` tiles: `true` or `false`.
  cache_features: false
  # Tile cap for prepare/train sampling: `0` or any positive integer.
  max_tiles: 8000
  tile_filter:
    # Enable prepare-time filtering: `true` or `false`.
    enabled: true
    # Tile filter mode; currently only `foreground_any` is supported.
    mode: foreground_any
    # Label ids treated as foreground by `tile_filter.mode`.
    foreground_labels: [1]
  augmentations:
    # Master switch for train-time augmentations: `true` or `false`.
    enable: false
    # Random horizontal flip during training: `true` or `false`.
    hflip: true
    # Random vertical flip during training: `true` or `false`.
    vflip: true
    # Random 90-degree rotations during training: `true` or `false`.
    rotate90: true
    # Allow image-only augments with stale cached features: `true` or `false`.
    allow_feature_mismatch: false
    cutout:
      # Enable Cutout masking augmentation: `true` or `false`.
      enable: true
      # Probability of applying Cutout to a training sample.
      prob: 0.25
      # Minimum Cutout hole size as a fraction of tile edge length.
      min_frac: 0.1
      # Maximum Cutout hole size as a fraction of tile edge length.
      max_frac: 0.3
      # Number of Cutout holes added when the augmentation triggers.
      num_holes: 2
      # Fill value written inside Cutout holes.
      fill: 0.0
    gridmask:
      # Enable GridMask augmentation: `true` or `false`.
      enable: false
      # Probability of applying GridMask to a sample.
      prob: 0.20
      # Minimum GridMask grid spacing in pixels.
      d_min: 48
      # Maximum GridMask grid spacing in pixels.
      d_max: 128
      # Masked-cell fraction inside each grid period.
      ratio: 0.5
      # Randomly rotate the GridMask pattern: `true` or `false`.
      rotate: true
      # Fill value written into masked GridMask cells.
      fill: 0.0
    color_jitter:
      # Enable brightness/contrast/saturation/hue jitter: `true` or `false`.
      enable: true
      # Probability of applying ColorJitter to a sample.
      prob: 0.35
      # Brightness jitter strength.
      brightness: 0.3
      # Contrast jitter strength.
      contrast: 0.3
      # Saturation jitter strength.
      saturation: 0.3
      # Hue jitter strength.
      hue: 0.1
  splits:
    # Explicit training tile list path, or blank for random split.
    train_list:
    # Explicit validation tile list path, or blank for random split.
    val_list:
  validation:
    # Enable semantic checks on cached tiles: `true` or `false`.
    enabled: true
    # Valid class ids expected inside labels after sanitization.
    allowed_labels: [0, 1]
    # Ignore label used by losses/metrics for invalid or masked pixels.
    ignore_index: 255
    # Policy for labels outside `allowed_labels`: `map_to_ignore` or `error`.
    out_of_range_policy: map_to_ignore
    # Require all cached feature tensors to be finite: `true` or `false`.
    require_finite_features: true
    # Require cached image tensors to be finite: `true` or `false`.
    require_finite_images: true

model:
  # Frozen DINO backbone checkpoint used to extract transformer features.
  backbone: facebook/dinov3-vitl16-pretrain-sat493m
  # Transformer block ids extracted from the backbone and passed to the head.
  layers: [7,13,19,24]
  # Segmentation head architecture: `dino_dense_probe`, `dino_segdino_light`,
  # `maskformer`, `unet`, `unet_v2`, `unet_lite`, `unet_lite_plus`,
  # `unet_nano`, `unet_nano_fapm`, or `unet_topo_fusion`.
  head: unet_topo_fusion
  # Number of semantic output classes.
  num_classes: 2
  # Channel count per selected DINO feature map.
  dino_channels: 1024
  dense_probe:
    # Dense-probe normalization: `batchnorm`, `syncbn`, `groupnorm`, or `none`.
    norm_type: batchnorm
    # Group count used only when `norm_type: groupnorm`.
    groupnorm_groups: 32
  fusion:
    # Enable learned multi-layer fusion for compatible heads: `true` or `false`.
    enable: true
    # Decoder width after each per-layer projection.
    hidden: 64
    # Hidden width for the learned layer-mixing MLP.
    layer_hidden: 128
    # Maximum number of DINO layers the fusion module can mix.
    max_layers: 6
    # Save full spatial fusion-weight maps for diagnostics: `true` or `false`.
    save_maps: false
  lora:
    # Enable low-rank projection adapters in compatible heads: `true` or `false`.
    enable: true
    # LoRA rank used by compatible projection adapters.
    rank: 8
    # LoRA alpha scaling factor.
    alpha: 16.0
    # Dropout applied on the LoRA branch input.
    dropout: 0.0
    # Freeze the base projection and train only the LoRA update: `true` or `false`.
    freeze_base: true
  boundary_gate:
    # Enable boundary-aware gating/refinement in compatible heads: `true` or `false`.
    enable: true
    # Strength of the learned boundary gate modulation.
    scale: 0.1
    # Clamp the gate output to its stable range: `true` or `false`.
    clamp: true

prepare:
  # Run the tile-building phase before verification/training: `true` or `false`.
  enable: false
  # Tile edge length in pixels for cached `.pt` samples.
  tile_size: 960
  # Torch device string for prepare; common values are `cuda`, `cpu`, or `mps`.
  device: cuda
  # Override for feature caching during prepare; keep aligned with `dataset.cache_features`.
  cache_features: false
  # Worker count used by prepare for tiling/raster extraction.
  workers: 16

verify:
  # Run cached-tile verification before training: `true` or `false`.
  enable: false
  # Worker count used to scan cached `.pt` tiles.
  workers: 8

train:
  # Run supervised training: `true` or `false`.
  enable: false
  # Torch device string for training; common values are `cuda`, `cpu`, or `mps`.
  device: cuda
  # Cached tile directory used by training; override `paths.processed_dir` here if needed.
  processed_dir: /mnt/ceph-hdd/projects/mthesis_davide_mattioli/processed/folder_2_2
  # Directory where checkpoints and bad-batch dumps are written.
  weights_dir: /user/davide.mattioli/u20330/Dinov3-LWF-Segmentation/weights/
  # Per-rank training batch size.
  batch_size: 4
  # Number of training epochs.
  epochs: 60
  # Muon learning rate for matrix-like parameter groups.
  muon_lr: 0.02
  # Optional explicit Muon weight decay; blank reuses `adamw_wd`.
  muon_wd:
  # Target RMS multiplier for Muon paper-style update scaling.
  muon_update_scale: 0.2
  # Scale Muon updates by matrix shape when true.
  muon_adjust_lr_for_shape: true
  # AdamW learning rate for bias-like, embedding, and 1D parameter groups.
  adamw_lr: 0.0003
  # AdamW weight decay.
  adamw_wd: 0.01
  # Momentum used by the Muon optimizer path.
  momentum: 0.95
  # Early-stopping patience measured in epochs.
  patience: 30
  # Validation split fraction when explicit split lists are not provided.
  val_fraction: 0.25
  # DataLoader worker count for training and validation loaders.
  num_workers: 4
  # Gradient-accumulation steps before each optimizer update.
  grad_accum_steps: 1
  # Enable `torch.compile` for the train-time model wrapper: `true` or `false`.
  compile: false
  # EMA decay; `0.0` disables exponential moving average weights.
  ema_decay: 0.995
  plots:
    epoch:
      # Enable per-epoch validation plot exports: `true` or `false`.
      enable: true
      # Plot output directory when MLflow artifact redirection is not active.
      dir: output/plot
      # Matplotlib colormap name, for example `tab20`, `viridis`, or `magma`.
      cmap: tab20
      # Number of validation tile pairs shown per epoch.
      pairs: 4
      # Seed offset used for deterministic epoch plot sampling.
      seed_offset: 1000
      # Class id used for per-tile metric overlays in plots.
      metric_class_index: 1
    paper:
      # Emit curated paper-oriented copies under `artifacts/plots/*/paper`: `true` or `false`.
      enable: true
      # Number of qualitative validation samples kept in paper copies.
      pairs: 3
      # Number of top channels shown in paper XAI panels.
      xai_topk_channels: 2
      # Render attention-rollout panels in paper XAI copies: `true` or `false`.
      render_attn_rollout: false
      # Render PCA panels in paper XAI copies: `true` or `false`.
      render_pca: false
      # Number of stable channels shown in paper trend/bar summaries.
      channel_top_n_stable: 6
      # Keep the channel-importance heatmap in paper copies: `true` or `false`.
      include_channel_heatmap: false
    xai:
      # Enable epoch-level explainability artifacts: `true` or `false`.
      enable: true
      # Foreground class index used by XAI methods.
      class_index: 1
      # Number of channels highlighted in top-k channel panels.
      topk_channels: 5
      # CAM layer selection mode: `last_requested_layer` or `first_requested_layer`.
      cam_layer_mode: last_requested_layer
      # Render DINO attention rollout maps when available: `true` or `false`.
      render_attn_rollout: true
      pca:
        # Enable PCA visualizations of DINO feature maps: `true` or `false`.
        enable: true
        # PCA layer mode: `same_as_cam`, `last_requested_layer`, or
        # `first_requested_layer`.
        layer_mode: same_as_cam
      branch_importance:
        # Enable gradient-based image-vs-DINO branch importance plots: `true` or
        # `false`.
        enable: true
        # Class index used for branch-importance attribution.
        class_index: 1
        # Maximum validation samples used for branch-importance plots.
        max_samples: 4
      channel_tracking:
        # Enable epoch-level DINO channel-importance tracking: `true` or `false`.
        enable: true
        # Maximum validation samples used for channel tracking.
        max_samples: 64
        # Number of channels kept per sample before aggregation.
        top_k_per_sample: 5
        # Number of stable channels highlighted across epochs.
        top_n_stable: 10
        # Minimum sample presence ratio for a channel to count as stable.
        min_presence: 0.05
        # Save aggregated channel-importance JSON outputs: `true` or `false`.
        save_json: true
      module:
        # Enable module-specific XAI panels for compatible heads: `true` or `false`.
        enable: true
        # Run module-specific XAI every N epochs.
        every_n_epochs: 5
        # Maximum samples included in module-specific XAI.
        max_samples: 8
        # Save full-resolution module maps in addition to summaries: `true` or
        # `false`.
        save_maps: true
        # Boundary-band width in pixels for boundary-focused module metrics.
        boundary_band_px: 3
        # Threshold used by boundary-gate diagnostics.
        gate_threshold: 0.5
        # Numerical epsilon used by entropy-based module plots.
        entropy_eps: 1.0e-8
        # Fail the run on unsupported module-XAI paths: `true` or `false`.
        strict: false
        # Enable LoRA ratio diagnostics for compatible heads: `true` or `false`.
        enable_lora_ratio: true
        # Enable topology/skeleton-specific XAI panels for compatible heads:
        # `true` or `false`.
        enable_topology_panels: true
  loss:
    main:
      # Cross-entropy weight; `0.0` disables CE entirely.
      ce_weight: 0.0
      # Dice-loss weight for the main segmentation objective.
      dice_weight: 1.0
      # Weight applied to auxiliary deep-supervision logits when the head exposes them.
      aux_weight: 0.4
      # CE label-smoothing factor.
      label_smoothing: 0.08
    focal:
      # Focal-loss weight; `0.0` disables focal without changing CE.
      weight: 1.0
      # Focal gamma value.
      gamma: 2.0
      # Optional focal alpha; blank uses implementation default behavior.
      alpha:
    boundary:
      # Boundary BCE weight for heads that return `edge_logits`.
      weight: 0.3
      # Kernel size used to build boundary targets from semantic masks.
      kernel_size: 3
  topology:
    # Skeleton BCE weight for topology-aware heads.
    skeleton_weight: 0.1
    # Soft-clDice topology weight.
    weight: 0.15
    # Foreground class index used for binary topology extraction.
    class_index: 1
    # Iteration count for differentiable skeletonization.
    iters: 10
    # Use aux logits for topology loss when available: `true` or `false`.
    on_aux: true
    # Extra topology downsampling factor; `1` means no extra downsampling.
    downsample: 1
  stability:
    amp:
      # AMP mode: `auto`, `on`, or `off`.
      enabled: auto
      # AMP dtype used when AMP is enabled: `bf16` or `fp16`.
      dtype: bf16
    # Cast logits to fp32 before loss computation: `true` or `false`.
    loss_fp32: true
    # Gradient clipping norm; `0` disables clipping.
    grad_clip_norm: 1.0
    # Emit a warning when batch logits exceed this absolute magnitude.
    max_abs_logit_warn: 80.0
    nonfinite:
      # Behavior on non-finite batches: `stop_run`, `stop_epoch`, or `skip_batch`.
      action: stop_run
      # Abort after this many consecutive non-finite batches.
      max_consecutive_batches: 2
      # Abort after this many total non-finite batches in one epoch.
      max_total_batches_per_epoch: 5
      # Save a debug sample from a non-finite batch: `true` or `false`.
      save_bad_batch_sample: true
    # Check model parameters for non-finite values every N optimizer steps.
    check_params_every_steps: 50

inference:
  # Run inference after training/prepare: `true` or `false`.
  enable: true
  # Torch device string for inference; common values are `cuda`, `cpu`, or `mps`.
  device: cuda
  # Single-scene inference input path, or blank when using `input_dir`.
  input_tif:
  # Directory inference input path, or blank when using `input_tif`.
  input_dir: /mnt/ceph-hdd/projects/mthesis_davide_mattioli/patches_mt/folder_1/
  # Optional newline-delimited input manifest; when set, inference reads these
  # files in listed order instead of scanning `input_dir`.
  input_paths_file:
  # Output GeoTIFF path for single-scene inference, or the shared cumulative
  # prediction raster updated during `input_dir` runs.
  output_tif:
  # Optional directory used for inference-side artifacts such as plots when
  # `input_dir` is set.
  output_dir: test/
  # Legacy per-file prediction suffix; directory inference now updates one
  # shared `output_tif` instead of writing per-image TIFFs.
  output_suffix: _pred.tif
  # Glob used to discover input files inside `input_dir`.
  glob: "*.tif"
  # Checkpoint path to load, or leave blank to reuse the current train artifact.
  checkpoint: /user/davide.mattioli/u20330/Dinov3-LWF-Segmentation/weights/unet_topo_fusion_best.pth
  # Inference tile size in pixels.
  tile_size: 960
  # Overlap fraction between adjacent inference windows.
  overlap: 0.25
  merge:
    # Overlap merge mode: `center_weighted` or `uniform`.
    mode: center_weighted
  tta:
    # Enable horizontal-flip test-time augmentation: `true` or `false`.
    horizontal_flip: false
    # Enable vertical-flip test-time augmentation: `true` or `false`.
    vertical_flip: false
  explain:
    # Enable scene-level explainability dashboards during inference: `true` or
    # `false`.
    enable: false
    # Output directory for inference explainability figures.
    output_dir: plots
    # Foreground class index highlighted in inference explainability outputs.
    class_index: 1
    # Dashboard subplot layout: `2x2` or `1x4`.
    dashboard_layout: "2x2"
    # RGB overlay color as three integers in `[0, 255]`.
    pred_overlay_color: [120, 190, 255]
    # Overlay opacity used for predicted foreground masks.
    pred_overlay_alpha: 0.28
    # Save tile-level debug figures in addition to scene dashboards: `true` or
    # `false`.
    tile_debug_enable: false
    # Render one debug figure every N processed tiles.
    plot_every_n: 10
  vector:
    # Export cumulative foreground polygons as a shapefile: `true` or `false`.
    enable: false
    # EPSG code used for vector export reprojection.
    target_epsg: 4326
    # Append new scene polygons to an existing shapefile: `true` or `false`.
    append: true
    # Class id treated as foreground for vector export.
    foreground_class: 1

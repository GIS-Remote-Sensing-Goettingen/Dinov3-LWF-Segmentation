resources:
  # Global reproducibility and CPU/GEMM behavior.
  seed: 1337
  omp_threads: 4
  matmul_precision: high
  # Enable DistributedDataParallel when launching with torchrun.
  distributed: false
  # Backend used for distributed process groups.
  dist_backend: nccl

logging:
  # Runtime logging output (per_run=true creates one log per run id).
  level: debug
  timestamps: true
  file: /home/mak/PycharmProjects/SegEdge/experiments/dinov3Seg/logs/run.log
  per_run: true

paths:
  # Input imagery, GT labels, and cached tiles/features root.
  raw_images_dir: /home/mak/PycharmProjects/SegEdge/experiments/get_data_from_api/patches_mt/
  label_path: /run/media/mak/Partition of 1TB disk/SH_dataset/planet_labels_2022.tif
  processed_dir: /mnt/OS/processed_tiles_1024/

dataset:
  # If true, read/write precomputed DINO features instead of extracting on the fly.
  cache_features: false
  # 0 means "all tiles"; >0 limits prepare/train tile count.
  max_tiles: 0
  tile_filter:
    # Keep only tiles containing at least one foreground label.
    enabled: true
    mode: foreground_any
    foreground_labels: [1]
  augmentations:
    # Geometric augmentations are feature-safe; image-only augs require raw image path.
    enable: true
    hflip: true
    vflip: true
    rotate90: true
    # Keep false unless you intentionally allow image/feature augmentation mismatch.
    allow_feature_mismatch: false
    cutout:
      enable: true
      prob: 0.10
      min_frac: 0.08
      max_frac: 0.22
      num_holes: 1
      fill: 0.0
    gridmask:
      enable: false
      prob: 0.20
      d_min: 48
      d_max: 128
      ratio: 0.5
      rotate: true
      fill: 0.0
    color_jitter:
      enable: true
      prob: 0.35
      brightness: 0.25
      contrast: 0.25
      saturation: 0.12
      hue: 0.04
  splits:
    # Optional explicit split files; leave empty to use val_fraction sampling.
    train_list:
    val_list:
  validation:
    # Dataset-level semantic checks for labels/features before training.
    enabled: true
    allowed_labels: [0, 1]
    ignore_index: 255
    out_of_range_policy: map_to_ignore
    require_finite_features: true
    require_finite_images: true

model:
  # Frozen DINOv3-SAT backbone; selected transformer layers are fused by the head.
  backbone: facebook/dinov3-vitl16-pretrain-sat493m
  layers: [5, 11, 17, 23]
  head: unet_lite # dino_dense_probe | dino_segdino_light | unet | unet_v2 | unet_lite | unet_lite_plus | unet_nano | unet_nano_fapm | unet_topo_fusion | maskformer
  num_classes: 2
  dino_channels: 1024
  # Dense linear probe baseline options.
  dense_probe:
    # batchnorm | syncbn | groupnorm | none
    norm_type: batchnorm
    groupnorm_groups: 32
  # SegDINO-style multi-layer lightweight head options.
  segdino_light:
    proj_dim: 128
    # gelu | relu
    activation: gelu
    dropout: 0.0
    # If true, require feature count == len(model.layers).
    strict_layers: true
  # Learned multi-layer fusion over selected DINO hidden states.
  fusion:
    enable: true
    # Decoder width after per-layer projection.
    hidden: 64
    # Layer mixer MLP width (kept separate from projection width on purpose).
    layer_hidden: 128
    # Safety cap: mixer expects up to this many DINO layers (pads if fewer are provided).
    max_layers: 6
    # Save full spatial alpha maps only when needed (large artifacts).
    save_maps: false
  # LoRA-style low-rank adapters for feature projection.
  lora:
    enable: true
    rank: 8
    alpha: 16.0
    dropout: 0.0
    freeze_base: true
  # Boundary-feature gating branch.
  boundary_gate:
    enable: true
    # Gate multiplier = 1 + scale * sigmoid(gate).
    scale: 0.1
    # Clamp modulation to [1, 1 + scale] for stability.
    clamp: true

prepare:
  # Offline tile/feature preparation phase.
  enable: false
  tile_size: 512
  device: cuda
  cache_features: false
  workers: 8

verify:
  # Optional cache integrity/semantic verification phase.
  enable: false
  workers: 8

train:
  # Supervised segmentation training phase.
  enable: false
  device: cuda
  processed_dir: /mnt/OS/processed_tiles_1024/
  weights_dir: /home/mak/PycharmProjects/SegEdge/experiments/dinov3Seg/weights/
  batch_size: 4
  epochs: 30
  muon_lr: 0.02
  adamw_lr: 0.001
  adamw_wd: 0.01
  momentum: 0.95
  patience: 10
  val_fraction: 0.2
  num_workers: 4
  grad_accum_steps: 1
  compile: false
  ema_decay: 0.0
  # Plotting and explainability outputs generated during validation epochs.
  plots:
    epoch:
      enable: true
      dir: output/plot
      cmap: tab20
      pairs: 4
      seed_offset: 1000
      metric_class_index: 1
    xai:
      # Global XAI panel controls.
      enable: true
      class_index: 1
      topk_channels: 5
      cam_layer_mode: last_requested_layer
      render_attn_rollout: true
      pca:
        # PCA visualization of selected DINO feature layer.
        enable: true
        layer_mode: same_as_cam
      branch_importance:
        # Gradient-based importance split: image branch vs DINO branch.
        enable: true
        class_index: 1
        max_samples: 4
      channel_tracking:
        # Epoch-level influential-channel tracking and trend artifacts.
        enable: true
        max_samples: 64
        top_k_per_sample: 5
        top_n_stable: 10
        min_presence: 0.05
        save_json: true
      module:
        # Module-specific XAI for compatible heads (e.g., unet_topo_fusion).
        enable: true
        every_n_epochs: 5
        max_samples: 8
        save_maps: true
        boundary_band_px: 3
        gate_threshold: 0.5
        entropy_eps: 1.0e-8
        strict: false
        enable_lora_ratio: true
        enable_topology_panels: true
  loss:
    # Main segmentation loss terms (applied to main + aux logits where configured).
    main:
      # Cross-entropy term. Set 0.0 to disable CE contribution.
      ce_weight: 1.0
      # Dice term for overlap optimization.
      dice_weight: 1.0
      # Weight of aux head loss (deep supervision).
      aux_weight: 0.4
      label_smoothing: 0.08
    # Focal is controlled by weight (0.0 = disabled).
    focal:
      weight: 0.0
      gamma: 2.0
      # Class-balancing alpha (null/empty uses implementation default behavior).
      alpha:
    # Optional boundary BCE supervision.
    boundary:
      weight: 0.1
      kernel_size: 3
  # Topology supervision terms (computed on aux/low-res by default for stability/cost).
  topology:
    # BCE on auxiliary skeleton logits.
    skeleton_weight: 0.05
    # Soft-clDice topology term weight.
    weight: 0.15
    # Foreground class index for binary extraction in multiclass settings.
    class_index: 1
    # Iterations for differentiable skeletonization operator.
    iters: 10
    # Use auxiliary logits (H/8) for topology by default.
    on_aux: true
    # Additional downsampling factor for topology targets/preds (1=no extra downsample).
    downsample: 1
  stability:
    # Numerical-stability and fail-fast guards.
    amp:
      enabled: auto
      dtype: bf16
    loss_fp32: true
    grad_clip_norm: 1.0
    max_abs_logit_warn: 80.0
    nonfinite:
      action: stop_run
      max_consecutive_batches: 2
      max_total_batches_per_epoch: 5
      save_bad_batch_sample: true
    check_params_every_steps: 50

inference:
  # Inference/post-training prediction settings.
  enable: true
  device: cuda
  input_tif:  /home/mak/PycharmProjects/SegEdge/experiments/get_data_from_api/patches_mt/dop20_592000_5975000_1km_20cm.tif
  input_dir:
  output_tif: /home/mak/PycharmProjects/SegEdge/experiments/dinov3Seg/test/dop20_592000_5975000_1km_20cm_labels.tif
  output_dir:
  output_suffix: _pred.tif
  glob: "*.tif"
  checkpoint: /home/mak/PycharmProjects/SegEdge/experiments/dinov3Seg/weights/unet_lite_best.pth
  tile_size: 512
  overlap: 0.25
  tta:
    # Optional test-time augmentation.
    horizontal_flip: true
    vertical_flip: false
  explain:
    # Inference-time explainability dashboard export.
    enable: true
    output_dir: plots
    class_index: 1
    dashboard_layout: "4x3"
    pca_enable: true
    pca_layer_mode: last_requested_layer

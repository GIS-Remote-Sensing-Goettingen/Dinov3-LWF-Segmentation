resources:
  seed: 1337
  omp_threads: 4
  matmul_precision: high
  distributed: false
  dist_backend: nccl

logging:
  level: info
  timestamps: true
  file: logs/run.log
  per_run: true

paths:
  raw_images_dir: /path/to/imagery
  label_path: /path/to/labels.tif
  processed_dir: /path/to/cache

dataset:
  cache_features: false
  max_tiles: 0
  tile_filter:
    enabled: true
    mode: foreground_any
    foreground_labels: [1]
  augmentations:
    enable: true
    hflip: true
    vflip: true
    rotate90: true
    allow_feature_mismatch: false
    cutout:
      enable: true
      prob: 0.25
      min_frac: 0.08
      max_frac: 0.22
      num_holes: 1
      fill: 0.0
    gridmask:
      enable: true
      prob: 0.20
      d_min: 48
      d_max: 128
      ratio: 0.5
      rotate: true
      fill: 0.0
    color_jitter:
      enable: true
      prob: 0.35
      brightness: 0.25
      contrast: 0.25
      saturation: 0.12
      hue: 0.04
  splits:
    train_list:
    val_list:
  validation:
    enabled: true
    allowed_labels: [0, 1]
    ignore_index: 255
    out_of_range_policy: map_to_ignore
    require_finite_features: true
    require_finite_images: true

model:
  backbone: facebook/dinov3-vitl16-pretrain-sat493m
  layers: [5, 11, 17, 23]
  head: unet_v2
  num_classes: 2
  dino_channels: 1024

prepare:
  enable: true
  tile_size: 512
  device: cuda
  cache_features: false
  workers: 8

verify:
  enable: true
  workers: 8

train:
  enable: true
  device: cuda
  processed_dir: /path/to/cache
  weights_dir: weights
  batch_size: 4
  epochs: 30
  muon_lr: 0.02
  adamw_lr: 0.001
  adamw_wd: 0.01
  momentum: 0.95
  patience: 10
  val_fraction: 0.2
  num_workers: 4
  grad_accum_steps: 1
  compile: false
  ema_decay: 0.0
  epoch_plot: true
  epoch_plot_dir: output/plot
  epoch_plot_cmap: tab20
  epoch_plot_pairs: 4
  epoch_plot_seed_offset: 1000
  epoch_plot_metric_class_index: 1
  epoch_plot_xai_enable: true
  epoch_plot_xai_class_index: 1
  epoch_plot_xai_topk_channels: 5
  epoch_plot_xai_cam_layer_mode: last_requested_layer
  epoch_plot_xai_render_attn_rollout: true
  epoch_plot_xai_pca_enable: true
  epoch_plot_xai_pca_layer_mode: same_as_cam
  epoch_plot_xai_branch_importance_enable: true
  epoch_plot_xai_branch_importance_class_index: 1
  epoch_plot_xai_branch_importance_max_samples: 4
  epoch_plot_xai_channel_tracking_enable: true
  epoch_plot_xai_channel_tracking_max_samples: 64
  epoch_plot_xai_channel_top_k_per_sample: 5
  epoch_plot_xai_channel_top_n_stable: 10
  epoch_plot_xai_channel_min_presence: 0.05
  epoch_plot_xai_channel_save_json: true
  loss:
    ce_weight: 1.0
    dice_weight: 1.0
    aux_weight: 0.4
    label_smoothing: 0.1
    use_focal: false
    focal_gamma: 2.0
    focal_alpha:
    boundary_weight: 0.1
    boundary_kernel_size: 3
  stability:
    amp:
      enabled: auto
      dtype: bf16
    loss_fp32: true
    grad_clip_norm: 1.0
    max_abs_logit_warn: 80.0
    nonfinite:
      action: stop_run
      max_consecutive_batches: 2
      max_total_batches_per_epoch: 5
      save_bad_batch_sample: true
    check_params_every_steps: 50

inference:
  enable: false
  device: cuda
  input_tif: /path/to/scene.tif
  input_dir:
  output_tif: test/output_prediction.tif
  output_dir:
  output_suffix: _pred.tif
  glob: "*.tif"
  checkpoint: weights/unet_v2_best.pth
  tile_size: 512
  overlap: 0.25
  tta:
    horizontal_flip: true
    vertical_flip: false
  explain:
    enable: true
    output_dir: plots
    class_index: 1
    dashboard_layout: "4x3"
    pca_enable: true
    pca_layer_mode: last_requested_layer

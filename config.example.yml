resources:
  seed: 1337
  omp_threads: 4
  matmul_precision: high
  distributed: false
  dist_backend: nccl

logging:
  level: info
  timestamps: true
  file: logs/run.log
  per_run: true

paths:
  raw_images_dir: /path/to/imagery
  label_path: /path/to/labels.tif
  processed_dir: /path/to/cache

dataset:
  cache_features: false
  max_tiles: 0
  tile_filter:
    enabled: true
    mode: foreground_any
    foreground_labels: [1]
  augmentations:
    enable: true
    hflip: true
    vflip: true
    rotate90: true
    allow_feature_mismatch: false
    cutout:
      enable: true
      prob: 0.10
      min_frac: 0.08
      max_frac: 0.22
      num_holes: 1
      fill: 0.0
    gridmask:
      enable: false
      prob: 0.20
      d_min: 48
      d_max: 128
      ratio: 0.5
      rotate: true
      fill: 0.0
    color_jitter:
      enable: true
      prob: 0.35
      brightness: 0.25
      contrast: 0.25
      saturation: 0.12
      hue: 0.04
  splits:
    train_list:
    val_list:
  validation:
    enabled: true
    allowed_labels: [0, 1]
    ignore_index: 255
    out_of_range_policy: map_to_ignore
    require_finite_features: true
    require_finite_images: true

model:
  backbone: facebook/dinov3-vitl16-pretrain-sat493m
  layers: [5, 11, 17, 23]
  head: unet_v2
  num_classes: 2
  dino_channels: 1024
  enable_layer_fusion: true
  enable_lora: true
  enable_boundary_gate: true
  fusion_hidden: 64
  layer_fusion_hidden: 128
  max_layers_for_fusion: 6
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.0
  lora_freeze_base: true
  boundary_gate_scale: 0.1
  boundary_gate_clamp: true
  layer_mix_maps_enable: false

prepare:
  enable: true
  tile_size: 512
  device: cuda
  cache_features: false
  workers: 8

verify:
  enable: true
  workers: 8

train:
  enable: true
  device: cuda
  processed_dir: /path/to/cache
  weights_dir: weights
  batch_size: 4
  epochs: 30
  muon_lr: 0.02
  adamw_lr: 0.001
  adamw_wd: 0.01
  momentum: 0.95
  patience: 10
  val_fraction: 0.2
  num_workers: 4
  grad_accum_steps: 1
  compile: false
  ema_decay: 0.0
  # Plot settings are grouped under one branch.
  plots:
    epoch:
      enable: true
      dir: output/plot
      cmap: tab20
      pairs: 4
      seed_offset: 1000
      metric_class_index: 1
    xai:
      enable: true
      class_index: 1
      topk_channels: 5
      cam_layer_mode: last_requested_layer
      render_attn_rollout: true
      pca:
        enable: true
        layer_mode: same_as_cam
      branch_importance:
        enable: true
        class_index: 1
        max_samples: 4
      channel_tracking:
        enable: true
        max_samples: 64
        top_k_per_sample: 5
        top_n_stable: 10
        min_presence: 0.05
        save_json: true
      module:
        enable: true
        every_n_epochs: 5
        max_samples: 8
        save_maps: true
        boundary_band_px: 3
        gate_threshold: 0.5
        entropy_eps: 1.0e-8
        strict: false
        enable_lora_ratio: true
        enable_topology_panels: true
  loss:
    # Main segmentation terms.
    main:
      ce_weight: 1.0
      dice_weight: 1.0
      aux_weight: 0.4
      label_smoothing: 0.08
    # Focal is controlled by weight (0.0 = disabled).
    focal:
      weight: 0.0
      gamma: 2.0
      alpha:
    # Boundary supervision term.
    boundary:
      weight: 0.1
      kernel_size: 3
  # Topology and skeleton terms are grouped separately for clarity.
  topology:
    skeleton_weight: 0.05
    weight: 0.15
    class_index: 1
    iters: 10
    on_aux: true
    downsample: 1
  stability:
    amp:
      enabled: auto
      dtype: bf16
    loss_fp32: true
    grad_clip_norm: 1.0
    max_abs_logit_warn: 80.0
    nonfinite:
      action: stop_run
      max_consecutive_batches: 2
      max_total_batches_per_epoch: 5
      save_bad_batch_sample: true
    check_params_every_steps: 50

inference:
  enable: false
  device: cuda
  input_tif: /path/to/scene.tif
  input_dir:
  output_tif: test/output_prediction.tif
  output_dir:
  output_suffix: _pred.tif
  glob: "*.tif"
  checkpoint: weights/unet_v2_best.pth
  tile_size: 512
  overlap: 0.25
  tta:
    horizontal_flip: true
    vertical_flip: false
  explain:
    enable: true
    output_dir: plots
    class_index: 1
    dashboard_layout: "4x3"
    pca_enable: true
    pca_layer_mode: last_requested_layer
